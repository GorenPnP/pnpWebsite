  pg_admin:
    container_name: pg_admin
    image: dpage/pgadmin4:latest
    restart: unless-stopped
    networks:
      - django_internal
    ports:
      - 5000:5000
    environment:
      - PGADMIN_LISTEN_PORT=5000
      - PGADMIN_DEFAULT_EMAIL=vsteinbr@gmail.com
      - PGADMIN_DEFAULT_PASSWORD=SuperSecret
    volumes:
      - ./ppServer/backups:/backups:ro
      - pgadmin_workdir:/var/lib/pgadmin



volumes:
  postgres_data:
  django_src_volume:
  pgadmin_workdir:


networks:
  django_internal: # db, django
  django_nginx:    # django, nginx
  visual_prometheus_django: # django
    external: true
  visual_grafana_nginx: # nginx
