services:
  db:
    container_name: postgres
    image: dhi.io/postgres:18-alpine3.22
    restart: unless-stopped
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./ppServer/backups:/var/lib/postgresql/backups:ro
    networks:
      - django_internal
    ports:
      - 5432:5432
    env_file:
      - ./.env.dev.db
    healthcheck:
      test: ["CMD", "nc", "-z", "localhost", "5432"]
      interval: 10s
      timeout: 5s
      retries: 5


